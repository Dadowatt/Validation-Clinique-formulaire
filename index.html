<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="text-center mb-4 text-primary">Mieux se connaître</h1>

                        <form id="profileForm" novalidate>

                            <div class="mb-3">
                                <label for="fullname" class="form-label fw-bold text-secondary">Prénom & Nom </label>
                                <input type="text" id="fullname" class="form-control" placeholder="Prénom et Nom">
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold text-secondary">Email</label>
                                <input type="email" id="email" class="form-control" placeholder="Exemple@gmail.com">
                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="mb-3">
                                <label for="domain" class="form-label fw-bold text-secondary">Domaine de prédilection</label>
                                <select id="domain" class="form-select">
                                    <option value="">Sélectionne ton domaine...</option>
                                    <option value="Front-End">Front-End</option>
                                    <option value="Back-End">Back-End</option>
                                    <option value="Design/UX">Design / UX</option>
                                    <option value="Data">Data</option>
                                </select>

                                <div class="invalid-feedback"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label d-block fw-bold text-secondary">Tu es plutôt...</label>
                                <div id="workStyleGroup" class="border rounded p-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="workStyle" value="Early Bird"
                                            id="morning">
                                        <label class="form-check-label" for="morning">Early Bird</label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="workStyle" value="Night Owl"
                                            id="night">
                                        <label class="form-check-label" for="night">Night Owl</label>
                                    </div>
                                </div>

                                <small id="radioError" class="text-danger"></small>
                            </div>

                            <div class="mb-3">
                                <label class="form-label d-block fw-bold text-secondary">Centres d'intérêt</label>
                                <div id="interestsGroup" class="border rounded p-3">

                                    <div class="form-check">
                                        <input class="form-check-input interest" type="checkbox" value="Veille Tech">
                                        <label class="form-check-label">Veille Tech</label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input interest" type="checkbox" value="Gaming">
                                        <label class="form-check-label">Gaming</label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input interest" type="checkbox" value="Sport">
                                        <label class="form-check-label">Sport</label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input interest" type="checkbox" value="Musique">
                                        <label class="form-check-label">Musique</label>
                                    </div>

                                    <div class="form-check">
                                        <input class="form-check-input interest" type="checkbox" value="Lecture">
                                        <label class="form-check-label">Lecture</label>
                                    </div>

                                </div>

                                <small id="checkboxError" class="text-danger"></small>

                            </div>
                            <div class="mb-3">
                                <label for="bio" class="form-label fw-bold text-secondary">Raconte-nous une anecdote drôle ou ton ambition
                                    ultime dans la tech</label>
                                <textarea id="bio" rows="5" maxlength="255" class="form-control"></textarea>
                                <div class="d-flex justify-content-end mt-1">
                                    <small id="charCounter" class="text-muted">255 caractères restants</small>
                                </div>
                                <div class="invalid-feedback"></div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Créer mon profil</button>

                        </form>
                    </div>
                </div>
                <div id="profileCardContainer" class="mt-4">
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
